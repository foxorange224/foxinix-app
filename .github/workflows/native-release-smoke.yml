name: Smoke de la APK de release (NativeScript)

# Compila la app nativa en modo RELEASE (igual que la que se publica) y la
# abre en el emulador para comprobar que ARRANCA.
#
# Existe porque el smoke normal (native-smoke.yml) prueba la APK de
# depuración, y una build de release se comportaba distinto: la app se
# quedaba en negro al abrirla. El motivo era que la raíz del template
#<App.vue> era un Fragment (por un comentario en el nivel del root) y Vue
# sólo lo desenvuelve en desarrollo; en producción $el quedaba siendo el
# ancla del fragmento, sin vista nativa.
#
# Este smoke falla si la app no pinta su raíz, así que el problema no puede
# volver a colarse en una APK publicada.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "native/**"
      - ".github/workflows/native-release-smoke.yml"

permissions:
  contents: read

jobs:
  release:
    name: APK de release en el emulador
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar SDK y NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar el CLI de NativeScript
        run: npm install -g nativescript@9.1.2

      - name: Alinear el Gradle del CLI
        run: |
          CLI_DIR="$(npm root -g)/nativescript"
          echo "CLI: $CLI_DIR"
          sudo bash native/tools/fix-ns-cli-gradle.sh "$CLI_DIR"

      - name: Preparar el keystore
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/foxinix-release.jks"
          ls -l "$RUNNER_TEMP/foxinix-release.jks"

      - name: Compilar la APK nativa (release, firmada)
        working-directory: native
        env:
          NS_SKIP_ENV_CHECK: "1"
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          npm ci
          npm run sync
          ns build android --release --env.production \
            --key-store-path "$RUNNER_TEMP/foxinix-release.jks" \
            --key-store-password "$ANDROID_KEY_STORE_PASSWORD" \
            --key-store-alias "$ANDROID_KEY_ALIAS" \
            --key-store-alias-password "$ANDROID_KEY_STORE_PASSWORD"
          ls -lh platforms/android/app/build/outputs/apk/release/

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
            -camera-back none -camera-front none
          # OJO: este action ejecuta CADA línea del script en una shell
          # aparte, así que todo tiene que ir en una sola línea (si no,
          # las variables no se ven entre líneas).
          script: |
            APK="$(find "$GITHUB_WORKSPACE/native/platforms/android/app/build/outputs/apk/release" -name '*.apk' 2>/dev/null | head -1)"; mkdir -p capturas; echo "APK=$APK"; adb install -r "$APK" || echo "FALLO LA INSTALACIÓN"; adb logcat -c; adb shell am start -W -n io.foxinix.nativa/com.tns.NativeScriptActivity || true; sleep 25; adb exec-out screencap -p > capturas/pantalla.png; adb logcat -d > capturas/logcat.txt; adb shell dumpsys window | grep -E "mCurrentFocus" || true; adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true; adb pull /sdcard/ui.xml capturas/ui.xml >/dev/null 2>&1 || true; echo "=== errores de JavaScript ==="; grep -nE "Foxinix|TNS\.Native|AndroidRuntime|FATAL" capturas/logcat.txt || true

      - name: Comprobar que la app se ve
        run: |
          set -euo pipefail
          FALLO=0
          if grep -q "Failed to create View with entry.create" capturas/logcat.txt; then
            echo "::error::la app no pudo crear la vista raíz (se queda en negro)"
            FALLO=1
          fi
          if grep -q "la raíz no tiene vista nativa" capturas/logcat.txt; then
            echo "::error::la raíz del template no tiene vista nativa"
            FALLO=1
          fi
          if grep -q "E Foxinix" capturas/logcat.txt; then
            echo "::error::la app registró errores"
            grep -n "E Foxinix" capturas/logcat.txt || true
            FALLO=1
          fi
          if [ ! -s capturas/ui.xml ]; then
            echo "::error::no se pudo leer la pantalla (la app está en blanco o en negro)"
            FALLO=1
          fi
          echo "=== textos de la pantalla ==="
          grep -o 'text="[^"]*"' capturas/ui.xml 2>/dev/null | head -20 || true
          exit $FALLO

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foxinix-release-smoke
          path: capturas/*
          if-no-files-found: warn

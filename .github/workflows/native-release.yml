name: Publicar la APK de la app nativa

# Compila la app nativa (NativeScript) en modo release, la firma con la
# misma clave que los APK de Android y la adjunta a la release.
#
# OJO: la app nativa se firma con el MISMO keystore que los APK de
# Tauri (los secrets ANDROID_KEY_*), así que se puede instalar al lado
# de la app web sin conflictos de firma (y se actualiza sin perder
# datos si el paquete coincide).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        # Versión a publicar, sin la v (por ejemplo 0.2.4). Sirve para
        # adjuntar el APK a una release YA existente (la etiqueta se
        # toma de acá; sin el input se usaría github.ref_name, que en
        # un dispatch desde main es "main" y crearía una release basura).
        description: "Versión a publicar, sin la v (por ejemplo 0.2.4)"
        required: true
        default: "0.2.6"

permissions:
  contents: write

env:
  FOXINIX_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  native-android:
    name: APK nativa (Android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar SDK y NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar el CLI de NativeScript
        run: npm install -g nativescript@9.1.2

      - name: Alinear el Gradle del CLI
        # El CLI compila los plugins con Gradle 7.4.0 + AGP 7.1.2, que en
        # NS 9 no compilan (el runtime Android ya no es un paquete aparte).
        # OJO: `npm root -g` con sudo da otra carpeta (la de root), así que
        # la ruta se calcula SIN sudo y se le pasa al script.
        run: |
          CLI_DIR="$(npm root -g)/nativescript"
          echo "CLI: $CLI_DIR"
          sudo bash native/tools/fix-ns-cli-gradle.sh "$CLI_DIR"

      - name: Preparar el keystore
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/foxinix-release.jks"
          ls -l "$RUNNER_TEMP/foxinix-release.jks"

      - name: Compilar la APK nativa (release, firmada)
        working-directory: native
        env:
          NS_SKIP_ENV_CHECK: "1"
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          npm ci
          npm run sync
          # En release el CLI exige las claves de firma: se le pasan las
          # mismas que usa la app de Tauri (la contraseña de la clave es
          # la del almacén).
          ns build android --release --env.production \
            --key-store-path "$RUNNER_TEMP/foxinix-release.jks" \
            --key-store-password "$ANDROID_KEY_STORE_PASSWORD" \
            --key-store-alias "$ANDROID_KEY_ALIAS" \
            --key-store-alias-password "$ANDROID_KEY_STORE_PASSWORD"
          ls -lh platforms/android/app/build/outputs/apk/release/

      - name: Preparar el artefacto
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${FOXINIX_VERSION#v}"
          mkdir -p dist
          APK="$(find native/platforms/android/app/build/outputs/apk/release \
            -type f -name '*.apk' | sort | head -1)"
          test -n "$APK"
          cp "$APK" "dist/Foxinix-${VERSION}-nativo-android.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -1)"
          "$APKSIGNER" verify --print-certs "dist/Foxinix-${VERSION}-nativo-android.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: foxinix-nativo-android
          path: dist/*
          if-no-files-found: error

      - name: Adjuntar la APK a la release
        uses: softprops/action-gh-release@v2
        with:
          # En un dispatch la etiqueta sale del input (v + versión); en
          # un push de tag, de la propia etiqueta.
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          # Si esta workflow es la primera en llegar, crea la release: se
          # deja como prerelease (la app nativa todavía lo es) y con el
          # mismo nombre que le pone el workflow del escritorio.
          name: Foxinix ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          prerelease: true
          files: dist/Foxinix-*nativo-android.apk

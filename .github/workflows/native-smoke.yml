name: Capturas de la app nativa (NativeScript)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "native/**"
      - ".github/workflows/native-smoke.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compilar la APK nativa
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar SDK y NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar el CLI de NativeScript
        run: npm install -g nativescript@9.1.2

      - name: Alinear el Gradle del CLI
        # El CLI compila los plugins con Gradle 7.4.0 + AGP 7.1.2, que en
        # NS 9 no compilan (el runtime Android ya no es un paquete aparte).
        # OJO: `npm root -g` con sudo da otra carpeta (la de root), así que
        # la ruta se calcula SIN sudo y se le pasa al script.
        run: |
          CLI_DIR="$(npm root -g)/nativescript"
          echo "CLI: $CLI_DIR"
          sudo bash native/tools/fix-ns-cli-gradle.sh "$CLI_DIR"

      - name: Compilar la APK nativa (debug)
        working-directory: native
        # NS_SKIP_ENV_CHECK: el doctor del CLI exige el binario del
        # emulador (`emulator -help`) y en este job sólo se compila (el
        # emulador lo instala el job de capturas). Sin esto el doctor
        # aborta el build con exit 127.
        env:
          NS_SKIP_ENV_CHECK: "1"
        run: |
          npm ci
          npm run sync
          ns build android --apk --debug
          ls -lh platforms/android/app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: foxinix-nativa-apk
          path: native/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator:
    name: Capturas en emulador
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: foxinix-nativa-apk
          path: .

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: |
            adb install -r app-debug.apk
            mkdir -p capturas
            python3 "$GITHUB_WORKSPACE/native/tools/ci-captura.py" capturas

      - uses: actions/upload-artifact@v4
        with:
          name: foxinix-nativa-capturas
          path: capturas/*.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foxinix-nativa-ui
          path: capturas/*.xml
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foxinix-nativa-logcat
          path: capturas/logcat.txt
          if-no-files-found: warn

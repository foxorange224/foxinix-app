name: Diagnóstico de la APK de release (build propia)

# Compila la app nativa en modo RELEASE (igual que la que se publica) y
# la abre en el emulador para ver qué pasa. Sirve para depurar builds de
# producción: la APK de depuración funciona y la de release no, y los
# errores de JavaScript quedan escondidos (nativescript-vue sólo los
# relanza en desarrollo y el webpack borra los console.*).
#
# A diferencia de native-release-debug.yml, este workflow COMPILA la app:
# sirve para probar un arreglo antes de republicar.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "native/webpack.config.js"
      - "native/app/app.ts"
      - ".github/workflows/native-prod-diag.yml"

permissions:
  contents: read

jobs:
  build-and-run:
    name: Compilar y abrir en el emulador
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar SDK y NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar el CLI de NativeScript
        run: npm install -g nativescript@9.1.2

      - name: Alinear el Gradle del CLI
        run: |
          CLI_DIR="$(npm root -g)/nativescript"
          echo "CLI: $CLI_DIR"
          sudo bash native/tools/fix-ns-cli-gradle.sh "$CLI_DIR"

      - name: Preparar el keystore
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/foxinix-release.jks"
          ls -l "$RUNNER_TEMP/foxinix-release.jks"

      - name: Compilar la APK nativa (release, firmada)
        working-directory: native
        env:
          NS_SKIP_ENV_CHECK: "1"
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          npm ci
          npm run sync
          ns build android --release --env.production \
            --key-store-path "$RUNNER_TEMP/foxinix-release.jks" \
            --key-store-password "$ANDROID_KEY_STORE_PASSWORD" \
            --key-store-alias "$ANDROID_KEY_ALIAS" \
            --key-store-alias-password "$ANDROID_KEY_STORE_PASSWORD"
          ls -lh platforms/android/app/build/outputs/apk/release/
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp platforms/android/app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/apk/foxinix-release.apk"
          ls -lh "$GITHUB_WORKSPACE/apk/"

      - name: Compilar la APK de depuración con el JS de producción
        # Sirve para saber si lo que rompe la app es el MODO de webpack
        # (producción) o el tipo de build de Gradle (release).
        working-directory: native
        env:
          NS_SKIP_ENV_CHECK: "1"
        run: |
          set -uo pipefail
          ns build android --apk --debug --env.production || echo "FALLÓ LA BUILD DEBUG"
          find platforms/android/app/build/outputs/apk -name '*.apk' -newer package.json 2>/dev/null | head -3
          APK="$(find platforms/android/app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | head -1)"
          if [ -n "$APK" ]; then
            cp "$APK" "$GITHUB_WORKSPACE/apk/foxinix-debug-produccion.apk"
            echo "APK debug copiada"
          fi
          ls -lh "$GITHUB_WORKSPACE/apk/"

      - uses: actions/upload-artifact@v4
        with:
          name: foxinix-prod-apk
          path: apk/*
          if-no-files-found: error

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
            -camera-back none -camera-front none
          # OJO: este action ejecuta CADA línea del script en una shell
          # aparte, así que todo tiene que ir en una sola línea (si no,
          # las variables no se ven entre líneas).
          script: |
            APK1="$GITHUB_WORKSPACE/apk/foxinix-release.apk"; APK2="$GITHUB_WORKSPACE/apk/foxinix-debug-produccion.apk"; mkdir -p capturas; echo "=== 1) APK DE RELEASE ==="; adb install -r "$APK1" || echo "FALLO INSTALACIÓN 1"; adb logcat -c; adb shell am start -W -n io.foxinix.nativa/com.tns.NativeScriptActivity || true; sleep 25; adb exec-out screencap -p > capturas/release.png; adb logcat -d > capturas/release-logcat.txt; adb shell dumpsys window | grep -E "mCurrentFocus" || true; echo "=== 2) APK DEBUG CON JS DE PRODUCCIÓN ==="; adb uninstall io.foxinix.nativa || true; adb install -r "$APK2" || echo "FALLO INSTALACIÓN 2"; adb logcat -c; adb shell am start -W -n io.foxinix.nativa/com.tns.NativeScriptActivity || true; sleep 25; adb exec-out screencap -p > capturas/debugprod.png; adb logcat -d > capturas/debugprod-logcat.txt; adb shell dumpsys window | grep -E "mCurrentFocus" || true; echo "=== ERRORES DE LA RELEASE ==="; grep -nE "Foxinix|TNS\.Native|AndroidRuntime|FATAL" capturas/release-logcat.txt || true; echo "=== ERRORES DE LA DEBUG-PROD ==="; grep -nE "Foxinix|TNS\.Native|AndroidRuntime|FATAL" capturas/debugprod-logcat.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foxinix-prod-diag
          path: capturas/*
          if-no-files-found: warn

name: Compilar y publicar Foxinix

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a compilar, sin la v (por ejemplo 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

env:
  FOXINIX_VERSION: ${{ inputs.version || github.ref_name }}
  CARGO_TERM_COLOR: always
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  linux:
    name: Linux (Debian, Fedora y AppImage)
    # 22.04 deja una base glibc compatible con Debian 12 y Fedora actuales.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        timeout-minutes: 45
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          # Los runners de Ubuntu pueden arrancar con unattended-upgrades
          # reteniendo el lock de dpkg; sin esto apt se queda esperando y
          # el release entero termina en timeout. También forzamos IPv4:
          # en Azure algunos espejos intentan IPv6 y no responden.
          timeout 30s sudo systemctl stop unattended-upgrades.service \
            apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          timeout 10s sudo systemctl stop apt-daily.timer \
            apt-daily-upgrade.timer 2>/dev/null || true
          if curl -4 -fsS --max-time 10 \
            http://azure.archive.ubuntu.com/ubuntu/dists/jammy/InRelease \
            >/dev/null 2>&1; then
            sudo sed -i \
              -e 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' \
              -e 's|http://security.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list
          fi
          APT_OPTS=(-o Acquire::ForceIPv4=true -o Acquire::Retries=3
            -o DPkg::Lock::Timeout=300)
          sudo apt-get "${APT_OPTS[@]}" update
          sudo apt-get "${APT_OPTS[@]}" \
            -o Dpkg::Options::=--force-confdef \
            -o Dpkg::Options::=--force-confold install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf rpm \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Compilar paquetes Linux
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles deb,rpm,appimage

      - name: Preparar artefactos
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${FOXINIX_VERSION#v}"
          mkdir -p dist
          cp src-tauri/target/release/bundle/deb/*.deb \
            "dist/Foxinix-${VERSION}-debian-amd64.deb"
          cp src-tauri/target/release/bundle/rpm/*.rpm \
            "dist/Foxinix-${VERSION}-fedora-x86_64.rpm"
          cp src-tauri/target/release/bundle/appimage/*.AppImage \
            "dist/Foxinix-${VERSION}-linux-x86_64.AppImage"
          chmod +x "dist/Foxinix-${VERSION}-linux-x86_64.AppImage"
          ls -lh dist
        working-directory: desktop
        # Los archivos se generan dentro de desktop/.
      - name: Subir artefactos Linux
        uses: actions/upload-artifact@v4
        with:
          name: foxinix-linux
          path: desktop/dist/*
          if-no-files-found: error

  windows:
    name: Windows (instalador NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar NSIS
        run: choco install nsis --no-progress -y

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Compilar instalador Windows
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles nsis

      - name: Preparar artefactos
        shell: pwsh
        run: |
          $version = "$env:FOXINIX_VERSION".TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
            Copy-Item -Destination "dist/Foxinix-$version-windows-x64-setup.exe"
          Get-ChildItem dist | Format-Table Name, Length
        working-directory: desktop

      - name: Subir artefacto Windows
        uses: actions/upload-artifact@v4
        with:
          name: foxinix-windows
          path: desktop/dist/*
          if-no-files-found: error

  android:
    name: Android (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            arch: arm64
            rust: aarch64-linux-android
          - target: armv7
            arch: armv7
            rust: armv7-linux-androideabi
          - target: x86_64
            arch: x86_64
            rust: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar SDK y NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if sdkmanager --install \
              "platforms;android-36" \
              "build-tools;36.0.0" \
              "ndk;27.0.12077973"; then
              break
            fi
            echo "Descarga de SDK/NDK falló (intento $attempt); reintentando..."
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973" \
              "$ANDROID_HOME/.temp" "$HOME/.android/cache"
            sleep 10
            if [ "$attempt" = 3 ]; then
              echo "No se pudo instalar el SDK/NDK después de 3 intentos" >&2
              exit 1
            fi
          done
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - name: Preparar proyecto Android
        working-directory: desktop
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          npm ci
          # El proyecto Android debe existir primero: tauri icon escribe los
          # mipmaps directamente en gen/android/app/src/main/res cuando esa
          # carpeta existe. Si se ejecuta antes de android init, el APK se
          # queda con el icono por defecto de Tauri.
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/icon.json
          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/foxinix-release.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=${ANDROID_KEY_ALIAS}
          password=${ANDROID_KEY_STORE_PASSWORD}
          storeFile=${RUNNER_TEMP}/foxinix-release.jks
          EOF
          python3 ../.github/scripts/patch_android.py

      - name: Compilar APK
        working-directory: desktop
        run: npx tauri android build --apk --target ${{ matrix.target }}

      - name: Preparar artefacto Android
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${FOXINIX_VERSION#v}"
          ARCH="${{ matrix.arch }}"
          mkdir -p dist
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort | head -1)"
          test -n "$APK"
          cp "$APK" "dist/Foxinix-${VERSION}-android-${ARCH}.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -1)"
          "$APKSIGNER" verify --print-certs "dist/Foxinix-${VERSION}-android-${ARCH}.apk"
          ls -lh dist
        working-directory: desktop

      - name: Subir artefacto Android
        uses: actions/upload-artifact@v4
        with:
          name: foxinix-android-${{ matrix.arch }}
          path: desktop/dist/*
          if-no-files-found: error

  release:
    name: Publicar en GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generar sumas SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          # La APK nativa la compila y adjunta el workflow de la app
          # nativa (native-release.yml). Se espera un poco a que esté en
          # la release para que las sumas la incluyan también.
          rm -rf /tmp/apk-nativa
          for i in $(seq 1 20); do
            if gh release download "${{ github.ref_name }}" \
                 --repo "${{ github.repository }}" \
                 --pattern "Foxinix-*-nativo-android.apk" \
                 --dir /tmp/apk-nativa 2>/dev/null; then
              break
            fi
            sleep 15
          done
          sha256sum Foxinix-* > SHA256SUMS
          if compgen -G "/tmp/apk-nativa/Foxinix-*-nativo-android.apk" > /dev/null; then
            sha256sum /tmp/apk-nativa/Foxinix-*-nativo-android.apk \
              | sed 's#/tmp/apk-nativa/##' >> SHA256SUMS
            sort -o SHA256SUMS SHA256SUMS
          fi
          cat SHA256SUMS

      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Foxinix ${{ github.ref_name }}
          body: |
            Foxinix para Linux, Windows y Android.

            ## Instalación
            - **Debian/Ubuntu:** `Foxinix-*-debian-amd64.deb`
            - **Fedora:** `Foxinix-*-fedora-x86_64.rpm`
            - **Arch Linux:** paquete `foxinix-bin` (se adjunta a la release)
            - **Otras distribuciones:** `Foxinix-*-linux-x86_64.AppImage`
            - **Windows 10/11:** `Foxinix-*-windows-x64-setup.exe`
            - **Android 7 o superior (64 bits):** `Foxinix-*-android-arm64.apk`
            - **Android 7 o superior (32 bits):** `Foxinix-*-android-armv7.apk`
            - **Android en emulador (x86_64):** `Foxinix-*-android-x86_64.apk`
            - **App nativa (nueva, Android):** `Foxinix-*-nativo-android.apk`

            Los APK de Android (arm64, armv7 y x86_64) llevan la interfaz
            web de https://foxinix.qzz.io/ y están firmados.

            ## Novedades v0.2.4
            - **App nativa (Android):** `Foxinix-0.2.4-nativo-android.apk` ya
              trae **notas de voz** (barra de grabación con punto, tiempo y
              onda en vivo; reproductor con play/pausa dentro de la burbuja) y
              **acciones del mensaje**: mantener pulsado un mensaje abre una
              hoja pegada abajo con las 12 reacciones rápidas de la web y las
              acciones de **responder, copiar texto, fijar, reenviar, editar y
              eliminar**. Las reacciones salen bajo la burbuja, la cita del
              mensaje respondido dentro de la burbuja y la barra de respuesta
              arriba del compositor, igual que en la web.
            - **App nativa, se ve como la web:** todas las pantallas (login,
              registro, lista de chats, conversación, Personas, perfil, grupo
              nuevo y Ajustes) se rediseñaron con el diseño real de la web
              (colores, cabeceras de 56 px, burbujas con radio 8, compositor y
              barra de pestañas) y los botones de sólo icono tienen nombre
              para TalkBack.
            - **App nativa, la foto dentro de la burbuja:** la imagen se ve
              **dentro de la burbuja** (con su pie de foto y la proporción
              real que manda el servidor) y al tocarla se abre un **visor a
              pantalla completa** con el original.
            - **App nativa, los avisos llegan de verdad:** los mensajes
              nuevos salen como **notificaciones del sistema** y, con la app
              en segundo plano, un **servicio en primer plano** propio
              mantiene viva la WebSocket (sin Firebase).
            - **Web:** sin cambios de interfaz (sólo las cadenas nuevas de los
              avisos de la app nativa).

            > La app nativa sigue siendo una **prerelease**: es una APK para
            > Android con el paquete `io.foxinix.nativa`, firmada con la
            > misma clave de publicación que el resto de las APK de Foxinix
            > (se actualiza encima de la v0.2.3 sin perder datos). Convive
            > con la app normal porque tiene otro paquete
            > (`io.foxinix.nativa` frente a `io.foxinix.desktop`).

            ## Novedades v0.2.3
            - **App nativa nueva (Android):** `Foxinix-0.2.3-nativo-android.apk`
              es Foxinix reescrito con **NativeScript 9 + Vue 3**: no es la
              web en un WebView, son vistas nativas que comparten el mismo
              núcleo de lógica que la web (API, store, i18n, tiempo real).
              Trae login/registro/verificación, lista de chats,
              conversación, Personas, grupo nuevo, perfil y Ajustes.
            - **En la app nativa:** envío de **imágenes y archivos** (selector
              del sistema, sin permisos de almacenamiento), **avisos del
              sistema** (canal "Foxinix", al tocar el aviso se abre el chat y
              el mensaje exactos) y **servicio en primer plano** propio
              (sin Firebase) para que la WebSocket siga viva con la app en
              segundo plano y los avisos lleguen de verdad.
            - **La imagen dentro de la burbuja** (app nativa): se ve la foto
              con su pie de foto, respetando la proporción real, y al
              tocarla se abre a pantalla completa con el original.
            - **Web:** notas de voz en cola (W99), estado "Ausente"
              automático a los 3 min de inactividad (W98), app **100% en
              inglés** con idioma automático del sistema (W97),
              cache-busting del landing sin depender del Purge de
              Cloudflare (W96), sin recarga forzada al entrar (W94/W95),
              corrección de 404 en los formatos compatibles de audio (W93)
              y deep links y 404 del sitio (W92).
            - **Arreglo de crash:** abrir un chat con mensajes de sistema
              ya no rompe la conversación (`sysText` no estaba expuesta a
              las plantillas).
            - **Más APK de Android:** ahora también se adjunta el de
              **x86_64** (además de arm64 y armv7).
            - **Servidor:** la lista de chats desempata por id del último
              mensaje (orden estable).

            > La app nativa es una **prerelease**: es una APK para Android
            > (109 MB) con el paquete `io.foxinix.nativa`, firmada con la
            > misma clave de publicación que el resto de las APK, así que
            > convive con la app normal porque tiene otro paquete
            > (`io.foxinix.nativa` frente a `io.foxinix.desktop`). Se puede
            > instalar sin problemas las dos a la vez.

            ## Novedades v0.2.2
            - **Dominio unificado:** la app carga ahora
              https://foxinix.qzz.io/ (el dominio anterior
              chat.foxinix.qzz.io dejó de resolver). La API vive en
              https://api.foxinix.qzz.io/ y el CDN en
              https://cdn.foxinix.qzz.io/.
            - **Importante para Android:** las APK v0.2.1 cargan el
              dominio antiguo y no pueden autoactualizarse; instalá la
              APK nueva de esta release manualmente (misma clave de
              firma: se actualiza sin perder datos).
            - **Portada con tema:** la landing sigue el tema claro/
              oscuro de la app o el del sistema.
            - **URLs legales limpias:** `/privacy` y `/terms` (las rutas
              `.html` viejas redirigen con 301).
            - **UI:** iconos en las pestañas del panel (Emojis, Stickers,
              GIFs), botón X para vaciar búsquedas y selección visible
              en Ajustes (en claro y oscuro).
            - **Sesión:** arreglo de la cookie de refresh en el primer
              arranque (W81/W82) y rutas `/app/group/*` que abren la
              shell de la app en vez de 404.
            - **Iconos y medios:** bundle de favicons renovado, GIFs de
              efectos de chat que faltaban e imágenes dentro de spoilers.
            - **Diseño y estabilidad:** nuevos tokens de color, arreglo
              de la app sin conexión, README unificado y limpieza de
              enlaces al dominio viejo.

            ## Notas
            - El AppImage incluye GStreamer para reproducir audio y video; los
              paquetes `.deb`/`.rpm` recomiendan esos plugins.
            - El AppImage se descarga sin permiso de ejecución: usa
              `chmod +x Foxinix-*.AppImage` antes de abrirlo.
            - Windows puede mostrar SmartScreen porque el instalador no tiene
              firma comercial.
            - Linux y Windows incluyen el envoltorio Tauri; Android usa el
              WebView del sistema.
            - En Android 13 o superior, acepta el permiso de notificaciones
              cuando la app lo pida. Si lo bloqueaste, actívalo en Ajustes >
              Aplicaciones > Foxinix > Permisos > Notificaciones.
            - Para actualizar en Android hace falta conservar la misma clave
              de firma. Las claves no se publican.
            - La APK nativa (NativeScript) va firmada con la misma clave de
              publicación de Foxinix (la de las APK de Android): no está en
              Google Play, pero se instala sin problema y se actualiza
              encima de la versión anterior sin perder datos.
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: true
